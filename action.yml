name: "pod-gen"
author: "Aramaan"
description: "generates a feed for a podcast from a YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "The commiter's email"
    required: true
    default: ${{github.actor}}@localhost
  name:
    description: "The commiter's name"
    required: true
    default: ${{github.actor}}
